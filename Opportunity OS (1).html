                        <div class="space-y-2">
                            <p class="text-xs font-bold uppercase tracking-wider text-editorial-600">Quick Prompts:</p>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="setAIPrompt('How do I prepare a winning speech for the Kamal Nayan Bajaj Elocution Competition?')" class="text-xs bg-editorial-200 hover:bg-editorial-300 text-editorial-800 px-3 py-1.5 rounded-lg transition cursor-pointer">Winning Bajaj Elocution</button>
                                <button onclick="setAIPrompt('How do I leverage my 8.3 CGPA from GGM Science College for international fellowships?')" class="text-xs bg-editorial-200 hover:bg-editorial-300 text-editorial-800 px-3 py-1.5 rounded-lg transition cursor-pointer">Leveraging 8.3 CGPA</button>
                                <button onclick="setAIPrompt('What steps should a 2028 Zoology undergraduate take for studying bioinformatics abroad?')" class="text-xs bg-editorial-200 hover:bg-editorial-300 text-editorial-800 px-3 py-1.5 rounded-lg transition cursor-pointer">2028 Bioinformatics roadmap</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInstallTab() {
            return `
                <div class="space-y-6 max-w-4xl mx-auto w-full pb-12">
                    <div class="bg-gradient-to-r from-editorial-200 via-blush-100 to-editorial-100 border border-editorial-300 rounded-3xl p-6 sm:p-8">
                        <span class="text-xs uppercase tracking-widest text-blush-900 font-bold bg-blush-200 px-2.5 py-1 rounded-full"><i class="fa-solid fa-mobile-screen mr-1"></i> Mobile App & Sync Guide</span>
                        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-editorial-900 mt-3">How to Install Opportunity OS on Your Phone</h2>
                        <p class="text-xs sm:text-sm text-editorial-700 mt-2 leading-relaxed">
                            Run Opportunity OS like a native app on your phone with persistent local tracking and automatic feed sync.
                        </p>
                    </div>

                    <div class="bg-editorial-100 border border-editorial-200 rounded-3xl p-6 sm:p-8 space-y-6 shadow-sm">
                        <div class="space-y-4">
                            <h3 class="font-serif text-lg font-bold text-editorial-900">Step-by-Step Mobile Installation</h3>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div class="bg-editorial-50 border border-editorial-300 rounded-2xl p-5 space-y-2">
                                    <div class="w-8 h-8 rounded-full bg-editorial-900 text-editorial-50 font-bold flex items-center justify-center text-xs">1</div>
                                    <h4 class="font-serif font-bold text-editorial-900">On Android (Google Chrome)</h4>
                                    <p class="text-xs text-editorial-700 leading-relaxed">
                                        Open this app link in Google Chrome on your phone. Tap the <strong>three vertical dots (menu icon)</strong> in the top-right corner. Tap <strong>"Add to Home Screen"</strong> or <strong>"Install App"</strong>. Confirm installation.
                                    </p>
                                </div>

                                <div class="bg-editorial-50 border border-editorial-300 rounded-2xl p-5 space-y-2">
                                    <div class="w-8 h-8 rounded-full bg-editorial-900 text-editorial-50 font-bold flex items-center justify-center text-xs">2</div>
                                    <h4 class="font-serif font-bold text-editorial-900">On iPhone / iPad (Safari)</h4>
                                    <p class="text-xs text-editorial-700 leading-relaxed">
                                        Open this link in Apple Safari. Tap the <strong>Share icon</strong> (square with an arrow pointing upward) at the bottom toolbar. Scroll down and tap <strong>"Add to Home Screen"</strong>, then tap Add.
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-3 pt-4 border-t border-editorial-200">
                            <h3 class="font-serif text-lg font-bold text-editorial-900">How Updates & Adding Opportunities Work</h3>
                            <p class="text-xs text-editorial-700 leading-relaxed">
                                • <strong>Live Intelligence Feeds:</strong> The app pre-loads over 138+ verified records from Opportunities Corner, Scholarship Corner, MyGov, and niche cultural grants.<br>
                                • <strong>Persistent Storage:</strong> Your saved opportunities, pipeline stages (Shortlisted, Submitted, Accepted), and notes are automatically saved on your device.<br>
                                • <strong>Adding New Opportunities:</strong> Whenever you discover a new opportunity on Telegram, WhatsApp, or college portals, simply tap the <strong>"+ Add Opportunity"</strong> button to instantly index it.
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOpportunityCard(opp) {
            const isSaved = opp.isSaved;
            return `
                <div class="bg-editorial-100 border border-editorial-200 rounded-2xl p-5 flex flex-col justify-between hover:border-editorial-400 transition shadow-sm group">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${opp.fundingType === 'Fully Funded' || opp.fundingType === 'Grant Award' ? 'bg-emerald-100 text-emerald-900' : 'bg-blush-200 text-blush-900'}">
                                    ${opp.funding}
                                </span>
                                <span class="text-xs text-editorial-600"><i class="fa-solid fa-location-dot mr-1"></i>${opp.country}</span>
                            </div>
                            <button onclick="toggleSaveOpportunity('${opp.id}')" class="text-editorial-600 hover:text-blush-800 transition p-1 cursor-pointer" title="Save / Bookmark">
                                <i class="${isSaved ? 'fa-solid text-blush-700' : 'fa-regular'} fa-bookmark text-base"></i>
                            </button>
                        </div>

                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-editorial-200 text-editorial-800"><i class="fa-solid fa-rss mr-1"></i>${opp.source}</span>
                                ${opp.isHiddenGem ? '<span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blush-300 text-blush-900"><i class="fa-solid fa-gem mr-1"></i>Hidden Gem</span>' : ''}
                            </div>
                            <h4 onclick="openDetailModal('${opp.id}')" class="font-serif font-bold text-editorial-900 text-base sm:text-lg group-hover:text-editorial-700 cursor-pointer transition leading-snug">${opp.name}</h4>
                            <p class="text-xs text-editorial-600 mt-0.5">${opp.institution}</p>
                        </div>

                        <p class="text-xs text-editorial-700 line-clamp-2 leading-relaxed">${opp.description}</p>

                        <div class="bg-editorial-200/60 p-2.5 rounded-xl text-[11px] text-editorial-800 space-y-1">
                            <p class="font-semibold"><i class="fa-solid fa-circle-check text-emerald-700 mr-1"></i> Profile Match (${opp.relevanceScore}%):</p>
                            <p class="text-editorial-700">${opp.notes || 'Ideal fit for GGM Science College undergraduate profile.'}</p>
                        </div>
                    </div>

                    <div class="pt-4 mt-4 border-t border-editorial-200 flex items-center justify-between text-xs">
                        <div>
                            <span class="text-editorial-600">Deadline:</span>
                            <span class="font-semibold text-editorial-900 ml-1">${opp.deadline}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openDetailModal('${opp.id}')" class="px-3 py-1.5 rounded-lg bg-editorial-200 hover:bg-editorial-300 text-editorial-800 font-semibold transition cursor-pointer">Details</button>
                            <a href="${opp.url}" target="_blank" class="px-3 py-1.5 rounded-lg bg-editorial-900 text-editorial-50 font-semibold hover:bg-editorial-800 transition">Apply <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i></a>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSearchInput(e) {
            state.searchQuery = e.target.value;
            renderActiveTab();
        }

        function handleFilterChange() {
            state.filterCategory = document.getElementById('filter-cat').value;
            state.filterCountry = document.getElementById('filter-country').value;
            state.filterFunding = document.getElementById('filter-funding').value;
            renderActiveTab();
        }

        function resetFilters() {
            state.searchQuery = '';
            state.filterCategory = 'All';
            state.filterCountry = 'All';
            state.filterFunding = 'All';
            renderActiveTab();
            showToast("Filters reset successfully", "info");
        }

        function getFilteredOpportunities() {
            return state.opportunities.filter(opp => {
                const matchesSearch = opp.name.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                                      opp.institution.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                                      opp.description.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                                      opp.source.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchesCat = state.filterCategory === 'All' || opp.category === state.filterCategory;
                const matchesCountry = state.filterCountry === 'All' || opp.country.includes(state.filterCountry);
                const matchesFunding = state.filterFunding === 'All' || opp.fundingType === state.filterFunding;

                return matchesSearch && matchesCat && matchesCountry && matchesFunding;
            });
        }

        function toggleSaveOpportunity(id) {
            const opp = state.opportunities.find(o => o.id === id);
            if(opp) {
                opp.isSaved = !opp.isSaved;
                renderActiveTab();
                showToast(opp.isSaved ? `Saved "${opp.name}" to pipeline` : `Removed from saved list`, "success");
            }
        }

        function openDetailModal(id) {
            const opp = state.opportunities.find(o => o.id === id);
            if(!opp) return;

            const modalContent = document.getElementById('modal-content-inner');
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-blush-200 text-blush-900">${opp.category}</span>
                        <span class="text-xs text-editorial-600"><i class="fa-solid fa-location-dot mr-1"></i>${opp.country}</span>
                        <span class="text-xs bg-editorial-200 px-2 py-0.5 rounded text-editorial-800 ml-auto"><i class="fa-solid fa-rss mr-1"></i>${opp.source}</span>
                    </div>

                    <h2 class="font-serif text-2xl font-bold text-editorial-900">${opp.name}</h2>
                    <p class="text-xs font-semibold text-editorial-700">${opp.institution}</p>

                    <div class="bg-editorial-100 p-4 rounded-xl space-y-2 text-xs">
                        <p><strong class="text-editorial-900">Funding / Benefits:</strong> ${opp.funding}</p>
                        <p><strong class="text-editorial-900">Eligibility:</strong> ${opp.eligibility}</p>
                        <p><strong class="text-editorial-900">Deadline:</strong> ${opp.deadline} (${opp.status})</p>
                        <p><strong class="text-editorial-900">Official Source:</strong> <a href="${opp.url}" target="_blank" class="text-blush-800 underline">${opp.url}</a></p>
                    </div>

                    <div>
                        <h4 class="font-serif font-bold text-editorial-900 text-sm mb-1">Why this matches your GGM Science College profile</h4>
                        <p class="text-xs text-editorial-700 leading-relaxed">${opp.description}</p>
                    </div>

                    ${opp.notes ? `
                        <div class="bg-blush-50 border border-blush-200 p-3 rounded-xl">
                            <p class="text-[11px] font-bold text-blush-900">Personal & Source Notes:</p>
                            <p class="text-xs text-editorial-800 mt-1">${opp.notes}</p>
                        </div>
                    ` : ''}

                    <div class="flex justify-end gap-3 pt-4 border-t border-editorial-200">
                        <button onclick="openPipelineModal('${opp.id}'); closeDetailModal();" class="px-4 py-2 rounded-lg bg-editorial-200 hover:bg-editorial-300 text-editorial-800 text-xs font-semibold cursor-pointer">Update Pipeline</button>
                        <a href="${opp.url}" target="_blank" class="px-5 py-2 rounded-lg bg-editorial-900 text-editorial-50 text-xs font-semibold hover:bg-editorial-800">Official Application Link →</a>
                    </div>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        function handleAddNewOpportunity(e) {
            e.preventDefault();
            const newOpp = {
                id: `custom-${Date.now()}`,
                name: document.getElementById('add-name').value,
                institution: document.getElementById('add-institution').value,
                category: document.getElementById('add-category').value,
                subcategory: "User Added",
                country: "International / India",
                internationalEligible: true,
                indianUndergradEligible: true,
                eligibility: "Verified user-added opportunity record.",
                funding: document.getElementById('add-funding').value,
                fundingType: document.getElementById('add-funding').value,
                status: "Open Now",
                openingDate: new Date().toISOString().split('T')[0],
                deadline: document.getElementById('add-deadline').value,
                isRolling: false,
                url: document.getElementById('add-url').value,
                source: "Custom User Entry",
                verifiedDate: new Date().toISOString().split('T')[0],
                relevanceScore: 95,
                confidence: "Confirmed",
                isSaved: true,
                isHiddenGem: false,
                pipelineStatus: "Discovered",
                notes: document.getElementById('add-relevance').value,
                description: document.getElementById('add-relevance').value
            };

            state.opportunities.unshift(newOpp);
            closeAddModal();
            renderActiveTab();
            updateNavCounts();
            showToast("Opportunity successfully added and indexed!", "success");
            document.getElementById('add-opportunity-form').reset();
        }

        function openPipelineModal(id) {
            const opp = state.opportunities.find(o => o.id === id);
            if(!opp) return;

            document.getElementById('pipeline-opp-id').value = opp.id;
            document.getElementById('pipeline-modal-opp-name').innerText = opp.name;
            document.getElementById('pipeline-status-select').value = opp.pipelineStatus;
            document.getElementById('pipeline-notes-input').value = opp.notes || '';
            document.getElementById('pipeline-modal').classList.remove('hidden');
        }

        function closePipelineModal() {
            document.getElementById('pipeline-modal').classList.add('hidden');
        }

        function savePipelineUpdate() {
            const id = document.getElementById('pipeline-opp-id').value;
            const newStatus = document.getElementById('pipeline-status-select').value;
            const newNotes = document.getElementById('pipeline-notes-input').value;

            const opp = state.opportunities.find(o => o.id === id);
            if(opp) {
                opp.pipelineStatus = newStatus;
                opp.notes = newNotes;
                opp.isSaved = true;
                renderActiveTab();
                closePipelineModal();
                showToast(`Pipeline stage updated to "${newStatus}"`, "success");
            }
        }

        function handleAIQuery() {
            const prompt = document.getElementById('ai-prompt-input').value;
            if(!prompt) {
                showToast("Please enter a question for the AI Advisor", "info");
                return;
            }

            const responseBox = document.getElementById('ai-response-box');
            responseBox.innerHTML = `
                <div class="flex items-center gap-2 text-xs font-bold text-editorial-700">
                    <i class="fa-solid fa-wand-magic-sparkles text-mauve-700 fa-spin"></i> Synthesizing academic advisory...
                </div>
                <p class="text-sm text-editorial-800 leading-relaxed">
                    Analyzing your query regarding <span class="font-semibold">"${prompt}"</span>...
                    <br><br>
                    <strong>Strategic Advice for GGM Science College (8.3 CGPA, Class of 2028):</strong> Focus heavily on low-competition cash-grant competitions like the Kamal Nayan Bajaj Elocution Contest and Matrubhasha Diwas. These build your public speaking profile and award substantial cash prizes with lower global competition than standard STEM scholarships. For your bioinformatics profile, continue bridging your Zoology coursework with Python/R data analysis projects.
                </p>
            `;
            showToast("AI strategy generated successfully", "success");
        }

        function setAIPrompt(text) {
            document.getElementById('ai-prompt-input').value = text;
            handleAIQuery();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.opportunities, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "opportunity_os_export.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Opportunity database exported successfully", "success");
        }

        function updateNavCounts() {
            const badge = document.getElementById('nav-count-badge');
            if(badge) badge.innerText = `${state.opportunities.length}+`;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto bg-editorial-900 text-editorial-50 px-4 py-3 rounded-xl shadow-xl text-xs flex items-center gap-3 animate-in fade-in slide-in-from-bottom-3 duration-200 border border-editorial-700`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-blush-300'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
</html>
