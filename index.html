                    btn.classList.add('bg-editorial-200', 'text-editorial-900', 'shadow-sm');
                    btn.classList.remove('text-editorial-700');
                } else {

                    btn.classList.add('text-editorial-700');
                }
            });

                    btn.classList.add('text-editorial-900', 'font-bold');
                    btn.classList.remove('text-editorial-600');
                } else {
                    btn.classList.remove('text-editorial-900', 'font-bold');
                    btn.classList.add('text-editorial-600');
                }
            });
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderOpportunityCards(list) {
            if(list.length === 0) return `<div class="col-span-full p-8 text-center text-xs text-editorial-600">No matching opportunities found.</div>`;
            return list.map(o => `
                <div class="bg-editorial-100 border border-editorial-200 rounded-2xl p-5 hover:border-editorial-400 transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="text-[10px] font-bold bg-editorial-200 text-editorial-800 px-2.5 py-0.5 rounded-full">${o.category}</span>
                            <span class="text-[10px] font-semibold bg-blush-200 text-blush-900 px-2 py-0.5 rounded">${o.funding}</span>
                        </div>
                        <h3 onclick="openDetail(${o.id})" class="font-serif text-lg font-bold text-editorial-900 cursor-pointer hover:underline">${o.name}</h3>
                        <p class="text-xs text-editorial-600 mt-0.5">${o.institution}</p>
                        <p class="text-xs text-editorial-700 mt-2 line-clamp-2">${o.desc}</p>
                    </div>
                    <div class="mt-4 pt-4 border-t border-editorial-200 flex items-center justify-between text-xs">
                        <span class="text-[11px] font-semibold text-editorial-600"><i class="fa-regular fa-clock mr-1"></i> ${o.deadline}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleBookmark(${o.id})" class="w-8 h-8 rounded-lg bg-editorial-200 text-editorial-800 flex items-center justify-center cursor-pointer hover:bg-editorial-300">
                                <i class="fa-${o.bookmark ? 'solid' : 'regular'} fa-bookmark text-xs"></i>
                            </button>
                            <a href="${o.url}" target="_blank" class="px-3 py-1.5 bg-editorial-900 text-editorial-50 rounded-lg text-xs font-semibold hover:bg-editorial-800">Apply →</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterOpportunities() {
            const query = document.getElementById('search-input')?.value.toLowerCase() || '';
            const cat = document.getElementById('category-filter')?.value || 'all';
            const filtered = opportunities.filter(o => {
                const matchQ = o.name.toLowerCase().includes(query) || o.institution.toLowerCase().includes(query) || o.desc.toLowerCase().includes(query);
                const matchC = cat === 'all' || o.category === cat;
                return matchQ && matchC;
            });
            const grid = document.getElementById('opportunity-grid');
            if(grid) grid.innerHTML = renderOpportunityCards(filtered);
        }

        function openDetail(id) {
            const o = opportunities.find(item => item.id === id);
            if(!o) return;
            const inner = document.getElementById('modal-content-inner');
            inner.innerHTML = `
                <span class="text-[10px] font-bold bg-editorial-200 text-editorial-800 px-2.5 py-0.5 rounded-full">${o.category}</span>
                <h2 class="font-serif text-2xl font-bold text-editorial-900 mt-2">${o.name}</h2>
                <p class="text-xs text-editorial-600 font-semibold mt-0.5">${o.institution}</p>
                
                <div class="my-4 p-4 bg-editorial-100 border border-editorial-200 rounded-xl space-y-2 text-xs text-editorial-700">
                    <p><strong>Funding:</strong> ${o.funding}</p>
                    <p><strong>Deadline:</strong> ${o.deadline}</p>
                    <p><strong>Eligibility:</strong> ${o.eligibility}</p>
                    <p><strong>Notes:</strong> ${o.notes}</p>
                </div>

                <p class="text-xs text-editorial-800 leading-relaxed">${o.desc}</p>

                <div class="mt-6 flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-editorial-200">
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-editorial-700 uppercase">Status:</label>
                        <select onchange="updateStatus(${o.id}, this.value)" class="bg-editorial-100 border border-editorial-300 rounded-lg px-3 py-1 text-xs text-editorial-900">
                            ${['Bookmark', 'Applied', 'Shortlisted', 'Accepted'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    <a href="${o.url}" target="_blank" class="px-4 py-2 bg-editorial-900 text-editorial-50 rounded-lg text-xs font-semibold hover:bg-editorial-800">Visit Official Portal →</a>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        function handleAddNewOpportunity(e) {
            e.preventDefault();
            const newOpp = {
                id: Date.now(),
                name: document.getElementById('add-name').value,
                institution: document.getElementById('add-institution').value,
                category: document.getElementById('add-category').value,
                funding: document.getElementById('add-funding').value,
                deadline: document.getElementById('add-deadline').value,
                url: document.getElementById('add-url').value,
                desc: document.getElementById('add-desc').value || 'Custom added opportunity.',
                eligibility: 'Open for applications',
                notes: 'Added via mobile command center.',
                status: 'Bookmark',
                bookmark: true,
                niche: document.getElementById('add-category').value.includes('Public Speaking') || document.getElementById('add-category').value.includes('Writing')
            };
            opportunities.unshift(newOpp);
            saveData();
            closeAddModal();
            renderContent();
            showToast('Opportunity added successfully!');
            document.getElementById('add-opportunity-form').reset();
        }

        function updateStatus(id, newStatus) {
            const o = opportunities.find(item => item.id === id);
            if(o) {
                o.status = newStatus;
                saveData();
                showToast(`Status updated to ${newStatus}`);
            }
        }

        function toggleBookmark(id) {
            const o = opportunities.find(item => item.id === id);
            if(o) {
                o.bookmark = !o.bookmark;
                saveData();
                renderContent();
            }
        }

        function toggleTheme() {
            showToast('Classic Editorial theme active.');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(opportunities, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "opportunity_os_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Database exported successfully!');
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-editorial-900 text-editorial-50 px-4 py-2 rounded-xl text-xs shadow-lg animate-fade-in pointer-events-auto';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initial render
        renderContent();
    </script>
