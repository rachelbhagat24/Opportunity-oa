            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });

                                    <p class="text-2xl font-serif font-bold text-editorial-900">${opportunities.filter(o=>o.status === 'Applied' || o.status === 'Shortlisted').length}</p>
